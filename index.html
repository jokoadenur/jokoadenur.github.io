<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portofolio Joko Adenur</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 24px; line-height: 1.6; color: #222; }
    header { text-align: center; margin-bottom: 32px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 16px; }
    .card h3 { margin: 0 0 8px; }
    .card a { text-decoration: none; color: #0969da; }
    .meta { font-size: 13px; color: #666; margin-top: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>Joko Adenur</h1>
    <p>Kumpulan karya dan proyek saya</p>
    <a href="https://github.com/jokoadenur">GitHub saya</a>
  </header>

  <div id="repos" class="grid">Memuat proyek...</div>

  <script>
    fetch("https://api.github.com/users/jokoadenur/repos?sort=updated&per_page=100")
      .then(r => r.json())
      .then(repos => {
        const el = document.getElementById("repos");
        el.innerHTML = "";
        repos
          .filter(r => !r.fork)
          .forEach(r => {
            el.innerHTML += `
              <div class="card">
                <h3><a href="${r.html_url}" target="_blank">${r.name}</a></h3>
                <p>${r.description || "Belum ada deskripsi"}</p>
                <div class="meta">${r.language || ""} · ⭐ ${r.stargazers_count}</div>
              </div>`;
          });
      })
      .catch(() => {
        document.getElementById("repos").textContent = "Gagal memuat proyek.";
      });
  </script>
</body>
</html>
